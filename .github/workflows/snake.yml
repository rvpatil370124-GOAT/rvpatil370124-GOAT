name: Generate Snake Game

on:
  schedule:
    # Runs once a day at midnight UTC — adjust as you like
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerates whenever you push to main

jobs:
  generate:
    permissions:
      contents: write     # required to push the generated SVG to the output branch
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: rvpatil370124-GOAT
          outputs: |
            dist/github-contribution-grid-snake-dark-blue.svg?palette=github-dark&color_snake=%2338BDF8
            dist/github-contribution-grid-snake.svg

      - name: Push generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
